[project]
name = "charlesops-api"
version = "0.1.0"
description = "FastAPI domain API for CharlesOps"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "Pillow>=10.4.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
