services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-charlesops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charlesops}
      POSTGRES_DB: ${POSTGRES_DB:-charlesops}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-charlesops} -d ${POSTGRES_DB:-charlesops}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://charlesops:charlesops@db:5432/charlesops}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_PREFIX: ${GCS_PREFIX:-charlesops}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      TEXT_GENERATION_MODEL: ${TEXT_GENERATION_MODEL:-gpt-5.5}
      TEXT_GENERATION_REASONING_EFFORT: ${TEXT_GENERATION_REASONING_EFFORT:-xhigh}
      TEXT_GENERATION_LIVE_CALLS_ENABLED: ${TEXT_GENERATION_LIVE_CALLS_ENABLED:-false}
      VISION_MODEL: ${VISION_MODEL:-gpt-4.1-mini}
      VISION_LIVE_CALLS_ENABLED: ${VISION_LIVE_CALLS_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER:-}
      NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:-}
      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
